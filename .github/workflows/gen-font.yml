name: Generate Russian font

on: workflow_dispatch

permissions:
  contents: write

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/gen_font_ru.py 18 FontRu src/font_ru.h
      - run: python scripts/gen_font_ru.py 13 FontRuSmall src/font_ru_small.h
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add src/font_ru.h src/font_ru_small.h
          git commit -m "Regenerate Russian fonts" || echo "no changes"
          git push
