name: Build ESP32-C3 Firmware

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Build firmware
        run: |
          pio run -e c3_clock
          pio run -e c3_clock_delorean
        env:
          OWM_KEY: ${{ secrets.OWM_KEY }}

      - name: Upload firmware (стандартная)
        uses: actions/upload-artifact@v4
        with:
          name: esp32c3-clock-firmware
          path: |
            .pio/build/c3_clock/firmware.bin
            .pio/build/c3_clock/bootloader.bin
            .pio/build/c3_clock/partitions.bin

      - name: Upload firmware (с DeLorean)
        uses: actions/upload-artifact@v4
        with:
          name: esp32c3-clock-firmware-delorean
          path: |
            .pio/build/c3_clock_delorean/firmware.bin
            .pio/build/c3_clock_delorean/bootloader.bin
            .pio/build/c3_clock_delorean/partitions.bin
