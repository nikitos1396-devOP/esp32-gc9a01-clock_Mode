; GC9A01 240x240 round SPI LCD clock, ESP32-C3 Super Mini
;
;   pio run                   build c3_clock

[platformio]
default_envs = c3_clock

[base]
platform  = espressif32@6.9.0
framework = arduino
board_build.partitions = huge_app.csv

monitor_speed = 115200
upload_speed  = 115200

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.0.4

extra_scripts = post:scripts/export_firmware.py

build_flags =
    -DOWM_KEY=\"${sysenv.OWM_KEY}\"
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=0

    -D USER_SETUP_LOADED=1
    -D GC9A01_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_MISO=-1

    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1

[c3]
extends = base
board = esp32-c3-devkitm-1
board_upload.flash_size   = 4MB
board_upload.maximum_size = 4194304
board_build.flash_size    = 4MB

extra_scripts =
    pre:scripts/patch_tft_c3.py
    post:scripts/export_firmware.py

build_flags =
    ${base.build_flags}
    -D TFT_SCLK=4
    -D TFT_MOSI=3
    -D TFT_CS=1
    -D TFT_DC=10
    -D TFT_RST=0
    -D SPI_FREQUENCY=40000000

[env:c3_clock]
extends = c3
build_src_filter = +<*> -<faces/face_delorean.cpp>

[env:c3_clock_delorean]
extends = c3
build_flags = ${c3.build_flags} -D WITH_DELOREAN
build_src_filter = +<*>
